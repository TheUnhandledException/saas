version: '3.8'

services:
  app:
    image: saas-sarcasmo-as-a-service:latest  # Replace with your image name (pre-built)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saas.rule=Host(`saas.woorkier.com.br`)"
      - "traefik.http.services.saas.loadbalancer.server.port=3000"
    ports:
      - "5000:5000"
    networks:
      - saas
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.saas.rule=Host(`saas.woorkier.com.br`)
        - traefik.http.routers.saas.entrypoints=websecure
        - traefik.http.routers.saas.priority=1
        - traefik.http.routers.saas.tls.certresolver=letsencryptresolver
        - traefik.http.routers.saas.service=saas_app
        - traefik.http.services.saas.loadbalancer.server.port=5000
        - traefik.http.services.saas.loadbalancer.passHostHeader=1

networks:
  saas:
    external: true
    name: saas  # The name of your existing Swarm network